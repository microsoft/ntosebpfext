#
# Checks for updates to dependencies downloaded via curl in CI workflows.
# Currently monitors: ProcDump and PSTools (Sysinternals), OpenCppCoverage.
#
# Versions and hashes live in .github/curl-dependencies.json (a regular,
# non-workflow file) rather than inline in the workflow files. This lets the
# built-in GITHUB_TOKEN push updates without the `workflow` scope, since no file
# under .github/workflows/ is modified. Do not inline these values back into the
# workflow files or this automation will fail to push.

name: Update curl-downloaded dependencies

on:
  # Allow this workflow to be manually triggered.
  workflow_dispatch:
  # Run this every day at 6am UTC.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  check-sysinternals:
    name: Check ${{ matrix.dependency }} for updates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependency: [procdump, pstools]
    env:
      DEPENDENCY: ${{ matrix.dependency }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Sysinternals archive update
        id: check
        run: |
          set -euo pipefail
          URL=$(jq -er --arg dep "$DEPENDENCY" '.[$dep].url' .github/curl-dependencies.json)
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 300 -o /tmp/dependency.zip "$URL"
          test -s /tmp/dependency.zip || { echo "ERROR: $DEPENDENCY download is empty"; exit 1; }
          NEW_HASH=$(sha256sum /tmp/dependency.zip | awk '{print toupper($1)}')
          rm /tmp/dependency.zip

          # Extract current hash from the dependency manifest.
          OLD_HASH=$(jq -er --arg dep "$DEPENDENCY" '.[$dep].hash' .github/curl-dependencies.json)
          echo "$DEPENDENCY ($URL): pinned SHA256=$OLD_HASH; downloaded SHA256=$NEW_HASH"
          echo "old_hash=$OLD_HASH" >> "$GITHUB_OUTPUT"
          echo "new_hash=$NEW_HASH" >> "$GITHUB_OUTPUT"
          if [ "$OLD_HASH" != "$NEW_HASH" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update hash and open PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_HASH: ${{ steps.check.outputs.old_hash }}
          NEW_HASH: ${{ steps.check.outputs.new_hash }}
        run: |
          set -euo pipefail
          BRANCH="auto/update-${DEPENDENCY}-hash"
          git switch -C "$BRANCH"
          jq --arg dep "$DEPENDENCY" --arg h "$NEW_HASH" '.[$dep].hash = $h' .github/curl-dependencies.json > /tmp/deps.json
          mv /tmp/deps.json .github/curl-dependencies.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/curl-dependencies.json
          git commit -m "Update $DEPENDENCY expected hash to $NEW_HASH"
          git push -f origin "$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR already exists for $BRANCH; skipping create."
          else
            gh pr create --title "Update $DEPENDENCY hash" \
              --body "$DEPENDENCY zip hash changed from \`$OLD_HASH\` to \`$NEW_HASH\`. Review the upstream archive before merging." \
              --base main --head "$BRANCH" || gh pr view "$BRANCH" --json number >/dev/null 2>&1
          fi

  check-opencppcoverage:
    name: Check OpenCppCoverage for updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for new OpenCppCoverage release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Get latest release tag from GitHub API.
          LATEST=$(gh api repos/OpenCppCoverage/OpenCppCoverage/releases/latest \
            --jq '.tag_name')
          # Current version pinned in the dependency manifest.
          CURRENT=$(jq -er '.opencppcoverage.version' .github/curl-dependencies.json)

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Download new installer and compute hash.
          LATEST_VERSION="${LATEST#release-}"
          NEW_URL="https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/${LATEST}/OpenCppCoverageSetup-x64-${LATEST_VERSION}.exe"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 300 -o /tmp/setup.exe "$NEW_URL"
          test -s /tmp/setup.exe || { echo "ERROR: OpenCppCoverage download is empty"; exit 1; }
          NEW_HASH=$(sha256sum /tmp/setup.exe | awk '{print toupper($1)}')
          rm /tmp/setup.exe

          OLD_HASH=$(jq -er '.opencppcoverage.hash' .github/curl-dependencies.json)

          echo "new_hash=$NEW_HASH" >> "$GITHUB_OUTPUT"
          echo "old_hash=$OLD_HASH" >> "$GITHUB_OUTPUT"

      - name: Update version/hash and open PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.check.outputs.latest }}
          CURRENT: ${{ steps.check.outputs.current }}
          OLD_HASH: ${{ steps.check.outputs.old_hash }}
          NEW_HASH: ${{ steps.check.outputs.new_hash }}
        run: |
          set -euo pipefail
          BRANCH="auto/update-opencppcoverage"
          git switch -C "$BRANCH"
          jq --arg v "$LATEST" --arg h "$NEW_HASH" \
            '.opencppcoverage.version = $v | .opencppcoverage.hash = $h' \
            .github/curl-dependencies.json > /tmp/deps.json
          mv /tmp/deps.json .github/curl-dependencies.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/curl-dependencies.json
          git commit -m "Update OpenCppCoverage to $LATEST"
          git push -f origin "$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR already exists for $BRANCH; skipping create."
          else
            gh pr create --title "Update OpenCppCoverage to $LATEST" \
              --body "Updates from \`$CURRENT\` to \`$LATEST\`. New hash: \`$NEW_HASH\`." \
              --base main --head "$BRANCH" || gh pr view "$BRANCH" --json number >/dev/null 2>&1
          fi
